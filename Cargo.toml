[workspace]
resolver = "3"
members = ["crates/straws-core", "crates/straws-cli", "crates/straws-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/xXTheKippersXx/straws"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The solver is far too slow unoptimised; keep it fast in debug builds too.
[profile.dev.package.faer]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
