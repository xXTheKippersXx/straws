<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="STRAWS: a fast, free NEC-2 antenna modeller, running in your browser." />
    <title>STRAWS antenna modeller</title>

    <!-- Built by trunk (see README.md in this folder). -->
    <link data-trunk rel="rust" href="../crates/straws-gui/Cargo.toml" data-bin="straws" data-wasm-opt="2" />
    <link data-trunk rel="copy-file" href="engine-worker.js" />
    <link data-trunk rel="copy-file" href="engine/straws-engine.wasm" />
    <link data-trunk rel="icon" href="../crates/straws-gui/icons/32x32.png" />
    <link data-trunk rel="copy-file" href="../crates/straws-gui/icons/256x256.png" />

    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1b1b1b;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: #d0d0d0;
        font: 16px system-ui, sans-serif;
        text-align: center;
        padding: 16px;
      }
      #loading img {
        width: 96px;
        height: 96px;
      }
      #loading a {
        color: #8ab4f8;
      }
    </style>
  </head>
  <body>
    <canvas id="straws"></canvas>
    <div id="loading">
      <img src="256x256.png" alt="" />
      <p>Loading STRAWS&hellip;</p>
      <noscript><p>STRAWS needs JavaScript and WebAssembly turned on.</p></noscript>
    </div>
  </body>
</html>
